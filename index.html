<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoShop</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;500&display=swap');

  :root{
    --bg:#0a0a0a; --surface:#111; --border:#222; --accent:#f0c040;
    --text:#e8e8e8; --muted:#555; --green:#3ddc84; --red:#ff5f5f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
  
  /* ── Layout ── */
  #app{display:flex;flex-direction:column;min-height:100vh}
  nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
  nav .logo{font-family:'Space Mono',monospace;font-weight:700;color:var(--accent);letter-spacing:-1px;font-size:1.1rem}
  nav .info{display:flex;align-items:center;gap:12px;font-size:.85rem}
  .bal{background:#1a1a1a;border:1px solid var(--border);padding:4px 10px;border-radius:4px;font-family:'Space Mono',monospace}
  main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}

  /* ── Tabs ── */
  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border)}
  .tab{padding:8px 16px;cursor:pointer;font-size:.85rem;border-bottom:2px solid transparent;color:var(--muted);transition:.2s;background:none;border-top:none;border-left:none;border-right:none;color:var(--muted);font-family:'DM Sans',sans-serif}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* ── Forms ── */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;max-width:380px;margin:40px auto}
  .card h2{font-family:'Space Mono',monospace;font-size:1rem;margin-bottom:20px;color:var(--accent)}
  input,textarea{width:100%;background:#0d0d0d;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:.2s}
  input:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  btn,button,.btn{background:var(--accent);color:#000;border:none;padding:10px 20px;border-radius:4px;font-weight:700;cursor:pointer;font-size:.85rem;transition:.15s;font-family:'DM Sans',sans-serif}
  button:hover,.btn:hover{filter:brightness(1.1)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .err{color:var(--red);font-size:.82rem;margin-top:6px}
  .ok{color:var(--green);font-size:.82rem;margin-top:6px}
  .switch{color:var(--muted);font-size:.82rem;margin-top:12px;text-align:center}
  .switch span{color:var(--accent);cursor:pointer}

  /* ── Products grid ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .product{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:.2s}
  .product:hover{border-color:var(--accent)}
  .product img{width:100%;height:120px;object-fit:cover;display:block}
  .product-info{padding:12px}
  .product-name{font-size:.9rem;font-weight:500;margin-bottom:4px}
  .product-price{font-family:'Space Mono',monospace;color:var(--accent);font-size:.85rem}
  .product button{width:100%;margin-top:10px;background:#1a1a1a;color:var(--text);border:1px solid var(--border)}
  .product button:hover{border-color:var(--accent);color:var(--accent)}

  /* ── Crypto ── */
  .crypto-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
  .crypto-label{font-family:'Space Mono',monospace;color:var(--accent);font-size:.85rem;margin-bottom:6px}
  .crypto-addr{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--muted);word-break:break-all;cursor:pointer}
  .crypto-addr:hover{color:var(--text)}
  .deposit-row{display:flex;gap:8px;margin-top:12px}
  .deposit-row input{flex:1}

  /* ── Chat ── */
  .chat-wrap{display:flex;gap:16px;height:65vh}
  #messages{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .msg-line{font-size:.85rem;line-height:1.5}
  .msg-line .pseudo{font-family:'Space Mono',monospace;color:var(--accent);margin-right:6px}
  .msg-line .ts{color:var(--muted);font-size:.72rem;margin-left:6px}
  .chat-input{display:flex;gap:8px;margin-top:12px}
  .chat-input input{flex:1}

  /* ── Admin ── */
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left}
  th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:.75rem}
  .badge{background:#1a1a1a;border:1px solid var(--border);padding:2px 8px;border-radius:3px;font-family:'Space Mono',monospace;font-size:.78rem}
  .badge.green{border-color:var(--green);color:var(--green)}

  /* ── Section header ── */
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .sec-head h3{font-family:'Space Mono',monospace;font-size:.9rem;color:var(--accent)}
  .add-form{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:20px;display:none}
  .add-form.open{display:block}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

  /* ── Toast ── */
  #toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#000;padding:10px 16px;border-radius:4px;font-weight:700;font-size:.82rem;opacity:0;pointer-events:none;transition:.3s;z-index:100}
  #toast.show{opacity:1}

  /* ── Auth section ── */
  #auth-section{display:flex;align-items:center;justify-content:center;min-height:80vh}
  #main-section{display:none}
</style>
</head>
<body>
<div id="app">
<nav>
  <div class="logo">⬡ CRYPTOSHOP</div>
  <div class="info" id="nav-info" style="display:none">
    <span id="nav-pseudo" style="color:var(--muted);font-size:.82rem"></span>
    <span class="bal">💰 <span id="nav-balance">0.00</span> €</span>
    <button class="btn btn-ghost" style="padding:4px 12px;font-size:.78rem" onclick="logout()">Déco</button>
  </div>
</nav>
<main>

<!-- ── AUTH ── -->
<div id="auth-section">
  <div class="card">
    <h2 id="auth-title">// CONNEXION</h2>
    <div class="row"><label>Pseudo</label><input id="a-pseudo" placeholder="monpseudo"></div>
    <div class="row"><label>Mot de passe</label><input id="a-pass" type="password" placeholder="••••••••"></div>
    <div id="auth-err" class="err"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="doAuth()">Entrer</button>
    <div class="switch" id="auth-switch">Pas de compte ? <span onclick="toggleRegister()">Créer un compte</span></div>
  </div>
</div>

<!-- ── MAIN ── -->
<div id="main-section">
  <div class="tabs">
    <button class="tab active" onclick="showTab('shop',this)">Boutique</button>
    <button class="tab" onclick="showTab('crypto',this)">Recharger</button>
    <button class="tab" onclick="showTab('chat',this)">Chat</button>
    <button class="tab" id="tab-admin" style="display:none" onclick="showTab('admin',this)">Admin</button>
  </div>

  <!-- SHOP -->
  <div id="tab-shop">
    <div class="sec-head">
      <h3>PRODUITS</h3>
      <button class="btn btn-ghost" id="btn-add-product" style="display:none;font-size:.78rem" onclick="toggleAddForm()">+ Ajouter</button>
    </div>
    <div class="add-form" id="add-form">
      <div class="form-row">
        <div class="row"><label>Nom</label><input id="p-name" placeholder="Nom du produit"></div>
        <div class="row"><label>Prix (€)</label><input id="p-price" type="number" placeholder="9.99"></div>
      </div>
      <div class="row"><label>Image (upload ou URL)</label><div style="display:flex;gap:8px;align-items:center"><input type="file" id="p-img-file" accept="image/*" style="flex:1;padding:6px" onchange="previewUpload(this)"><span style="color:var(--muted);font-size:.78rem">ou</span><input id="p-img" placeholder="https://..." style="flex:2"></div><div id="img-preview" style="margin-top:8px;display:none"><img id="img-preview-el" style="height:80px;border-radius:4px;border:1px solid var(--border)"></div></div>
      <button class="btn" onclick="addProduct()">Ajouter le produit</button>
    </div>
    <div class="grid" id="products-grid"></div>
  </div>

  <!-- CRYPTO -->
  <div id="tab-crypto" style="display:none">
    <div style="max-width:500px">
      <h3 style="font-family:'Space Mono',monospace;color:var(--accent);font-size:.9rem;margin-bottom:16px">ADRESSES DE RECHARGE</h3>
      <div id="crypto-list"></div>
      <div style="margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px">
        <div style="font-size:.82rem;color:var(--muted);margin-bottom:10px">Déclarer un virement en attente :</div>
        <div class="deposit-row">
          <input id="dep-amount" type="number" placeholder="Montant en €">
          <button class="btn" onclick="requestDeposit()">Déclarer</button>
        </div>
        <div id="dep-msg" class="ok" style="display:none">✓ Dépôt enregistré, en attente de validation admin</div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="tab-chat" style="display:none">
    <div class="chat-wrap" style="flex-direction:column">
      <div id="messages"></div>
      <div class="chat-input">
        <input id="chat-input" placeholder="Votre message..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn" onclick="sendMsg()">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="tab-admin-panel" style="display:none">
    <h3 style="font-family:'Space Mono',monospace;color:var(--accent);font-size:.9rem;margin-bottom:16px">DÉPÔTS EN ATTENTE</h3>
    <button class="btn btn-ghost" style="margin-bottom:16px;font-size:.78rem" onclick="loadPending()">↻ Rafraîchir</button>
    <table>
      <thead><tr><th>Pseudo</th><th>En attente</th><th>Solde actuel</th><th>Action</th></tr></thead>
      <tbody id="pending-tbody"></tbody>
    </table>
  </div>
</div>

</main>
</div>
<div id="toast"></div>

<script>
const socket = io();
let state = { pseudo: null, role: null, balance: 0 };
let isRegister = false;

// ── Auth ──────────────────────────────────────────────────────────────────────
function toggleRegister(){
  isRegister = !isRegister;
  document.getElementById('auth-title').textContent = isRegister ? '// INSCRIPTION' : '// CONNEXION';
  document.getElementById('auth-switch').innerHTML = isRegister
    ? 'Déjà un compte ? <span onclick="toggleRegister()">Se connecter</span>'
    : 'Pas de compte ? <span onclick="toggleRegister()">Créer un compte</span>';
}

async function doAuth(){
  const pseudo = document.getElementById('a-pseudo').value.trim();
  const pass   = document.getElementById('a-pass').value;
  if(!pseudo||!pass) return setErr('Remplis tous les champs');
  const url = isRegister ? '/api/register' : '/api/login';
  const r = await post(url,{pseudo,pass});
  if(!r.ok) return setErr(r.msg||'Erreur');
  if(isRegister){ toast('Compte créé !'); toggleRegister(); return; }
  state = { pseudo, role: r.role, balance: r.balance||0 };
  document.getElementById('auth-section').style.display='none';
  document.getElementById('main-section').style.display='block';
  document.getElementById('nav-info').style.display='flex';
  document.getElementById('nav-pseudo').textContent = `@${pseudo}`;
  document.getElementById('nav-balance').textContent = state.balance.toFixed(2);
  if(r.role==='admin'){
    document.getElementById('tab-admin').style.display='inline-block';
    document.getElementById('btn-add-product').style.display='inline-block';
    loadPending();
  }
  loadProducts();
}

function setErr(msg){ document.getElementById('auth-err').textContent=msg; }

function logout(){
  state={pseudo:null,role:null,balance:0};
  document.getElementById('auth-section').style.display='flex';
  document.getElementById('main-section').style.display='none';
  document.getElementById('nav-info').style.display='none';
}

// ── Products ──────────────────────────────────────────────────────────────────
async function loadProducts(){
  const products = await get('/api/products');
  renderProducts(products);
}
function renderProducts(products){
  const isAdmin = state.role === 'admin';
  document.getElementById('products-grid').innerHTML = products.map(p=>`
    <div class="product">
      <img src="${p.img}" alt="${p.name}" onerror="this.src='https://placehold.co/200x140/111/555?text=?'">
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${p.price.toFixed(2)} €</div>
        <button onclick="buyProduct(${p.price})">Acheter</button>
        ${isAdmin ? `<button onclick="deleteProduct(${p.id})" style="margin-top:4px;background:transparent;border:1px solid var(--red);color:var(--red);width:100%">🗑 Supprimer</button>` : ''}
      </div>
    </div>`).join('');
}
function buyProduct(price){
  if(state.balance < price) return toast('Solde insuffisant');
  state.balance -= price;
  document.getElementById('nav-balance').textContent = state.balance.toFixed(2);
  toast('✓ Achat effectué !');
}
function toggleAddForm(){
  document.getElementById('add-form').classList.toggle('open');
}
async function previewUpload(input){
  if(!input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  document.getElementById('img-preview-el').src = url;
  document.getElementById('img-preview').style.display = 'block';
  document.getElementById('p-img').value = '';
}

async function previewUpload(input){
  if(!input.files[0]) return;
  const url = URL.createObjectURL(input.files[0]);
  document.getElementById('img-preview-el').src = url;
  document.getElementById('img-preview').style.display = 'block';
  document.getElementById('p-img').value = '';
}

async function addProduct(){
  const name=document.getElementById('p-name').value.trim();
  const price=document.getElementById('p-price').value;
  const fileInput=document.getElementById('p-img-file');
  let img=document.getElementById('p-img').value.trim();
  if(!name||!price) return toast('Nom et prix requis');
  if(fileInput.files[0]){
    const fd=new FormData(); fd.append('img',fileInput.files[0]);
    const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin':'admin123'},body:fd}).then(x=>x.json());
    if(!r.ok) return toast('Erreur upload');
    img=r.url;
  }
  await post('/api/products',{name,price,img,adminPass:'admin123'});
  document.getElementById('p-img-file').value='';
  document.getElementById('img-preview').style.display='none';
  toggleAddForm(); loadProducts(); toast('Produit ajouté');
}

async function deleteProduct(id){
  if(!confirm('Supprimer ce produit ?')) return;
  await fetch('/api/products/'+id,{method:'DELETE',headers:{'x-admin':'admin123'}});
  loadProducts(); toast('Produit supprimé');
}

// ── Crypto ────────────────────────────────────────────────────────────────────
async function loadCrypto(){
  const c = await get('/api/crypto');
  document.getElementById('crypto-list').innerHTML = Object.entries(c).map(([k,v])=>`
    <div class="crypto-card">
      <div class="crypto-label">${k}</div>
      <div class="crypto-addr" onclick="copyAddr('${v}',this)">${v}<br><small style="color:var(--muted);font-size:.7rem">Cliquer pour copier</small></div>
    </div>`).join('');
}
function copyAddr(addr,el){
  navigator.clipboard.writeText(addr);
  el.innerHTML=`<span style="color:var(--green)">✓ Copié !</span>`;
  setTimeout(()=>loadCrypto(),1200);
}
async function requestDeposit(){
  const amount=document.getElementById('dep-amount').value;
  if(!amount||amount<=0) return toast('Montant invalide');
  await post('/api/deposit/request',{pseudo:state.pseudo,amount});
  document.getElementById('dep-msg').style.display='block';
  setTimeout(()=>document.getElementById('dep-msg').style.display='none',4000);
}

// ── Chat ──────────────────────────────────────────────────────────────────────
socket.on('msg',({pseudo,text,ts})=>{
  const box=document.getElementById('messages');
  const d=new Date(ts);
  const time=`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  box.innerHTML+=`<div class="msg-line"><span class="pseudo">${pseudo}</span>${text}<span class="ts">${time}</span></div>`;
  box.scrollTop=box.scrollHeight;
});
socket.on('products',renderProducts);

function sendMsg(){
  const inp=document.getElementById('chat-input');
  if(!inp.value.trim()) return;
  socket.emit('msg',{pseudo:state.pseudo,text:inp.value.trim()});
  inp.value='';
}

// ── Admin ─────────────────────────────────────────────────────────────────────
async function loadPending(){
  const list = await fetch('/api/admin/pending',{headers:{'x-admin':'admin123'}}).then(r=>r.json());
  document.getElementById('pending-tbody').innerHTML = list.length
    ? list.map(u=>`<tr>
        <td><span class="badge">@${u.pseudo}</span></td>
        <td><span class="badge green">+${u.pending.toFixed(2)} €</span></td>
        <td>${u.balance.toFixed(2)} €</td>
        <td><button class="btn" style="padding:4px 12px;font-size:.78rem" onclick="validate('${u.pseudo}')">Valider</button></td>
      </tr>`).join('')
    : '<tr><td colspan="4" style="color:var(--muted);text-align:center">Aucun dépôt en attente</td></tr>';
}
async function validate(pseudo){
  await post('/api/admin/validate',{pseudo,adminPass:'admin123'});
  toast(`✓ Dépôt validé pour @${pseudo}`); loadPending();
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(name,btn){
  ['shop','crypto','chat','admin-panel'].forEach(t=>
    document.getElementById('tab-'+t).style.display='none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).style.display='block';
  btn.classList.add('active');
  if(name==='crypto') loadCrypto();
  if(name==='admin') loadPending();
}

// ── Utils ─────────────────────────────────────────────────────────────────────
const post=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
const get=(url)=>fetch(url).then(r=>r.json());
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
